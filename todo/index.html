<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日待办 · 航班工作工具集</title>
<style>
  /* ============ Design Tokens（与站点统一）============ */
  :root {
    --brand: #2563eb; --brand-dark: #1d4ed8; --brand-deep: #1e3a8a;
    --brand-light: #eff6ff; --brand-soft: #dbeafe;
    --ink: #0f172a; --ink-2: #334155; --muted: #64748b; --muted-2: #94a3b8;
    --line: #e2e8f0; --bg: #f1f5f9; --card: #ffffff;
    --radius: 16px; --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.06), 0 1px 3px rgba(15,23,42,0.04);
    --shadow: 0 4px 6px -1px rgba(15,23,42,0.07), 0 2px 4px -2px rgba(15,23,42,0.05);
    --shadow-lg: 0 20px 25px -5px rgba(15,23,42,0.10), 0 8px 10px -6px rgba(15,23,42,0.06);
    --ok: #16a34a; --ok-light: #dcfce7;
    --warn: #d97706; --warn-light: #fef3c7;
    --danger: #dc2626; --danger-light: #fee2e2;
    --p-high: #dc2626; --p-mid: #d97706; --p-low: #64748b;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink-2); line-height: 1.6; min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 100% -10%, #e0ecff 0%, rgba(224,236,255,0) 55%),
      radial-gradient(900px 500px at -10% 0%, #eef2ff 0%, rgba(238,242,255,0) 50%),
      var(--bg);
  }
  /* ============ Header ============ */
  .header {
    position: relative; overflow: hidden;
    background: linear-gradient(130deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
    color: #fff; padding: 30px 34px; border-radius: 22px; margin: 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    box-shadow: 0 18px 40px -12px rgba(37,99,235,0.45);
  }
  .header::before { content: ""; position: absolute; top: -60px; right: -30px; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.28), rgba(255,255,255,0) 70%); }
  .header .eyebrow { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase;
    background: rgba(255,255,255,0.16); padding:5px 12px; border-radius:20px; backdrop-filter: blur(6px); margin-bottom:10px; }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .header p { font-size: 13.5px; opacity: 0.9; margin-top: 6px; }
  .header .ic { font-size: 46px; line-height: 1; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.2)); }
  .container { max-width: 980px; margin: 0 auto; padding: 0 24px 48px; }
  a.back { display:inline-flex; align-items:center; gap:6px; color:var(--brand); text-decoration:none; font-weight:600; font-size:14px; margin: 0 0 16px 4px; }
  a.back:hover { text-decoration: underline; }

  /* ============ Toolbar ============ */
  .toolbar { background: var(--card); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm);
    padding: 16px 18px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .toolbar .date-wrap { display:flex; align-items:center; gap:8px; }
  .toolbar label { font-size:13px; color:var(--muted); font-weight:600; }
  .toolbar input[type=date] { font: inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius: var(--radius-sm); color:var(--ink); }
  .tabs { display:flex; background: var(--bg); border-radius: 999px; padding:4px; margin-left:auto; }
  .tabs button { border:0; background:transparent; font:inherit; font-size:13px; font-weight:600; color:var(--muted); padding:7px 16px; border-radius:999px; cursor:pointer; transition:.18s; }
  .tabs button.active { background: var(--brand); color:#fff; box-shadow: var(--shadow-sm); }

  /* ============ Buttons ============ */
  .btn { border:0; font:inherit; font-size:13px; font-weight:600; padding:9px 14px; border-radius: var(--radius-sm); cursor:pointer; transition:.18s; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { transform: translateY(-1px); }
  .btn-ghost { background: var(--bg); color: var(--ink-2); }
  .btn-ghost:hover { background: var(--brand-soft); color: var(--brand-dark); }
  .btn-primary { background: var(--brand); color:#fff; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-danger { background: var(--danger-light); color: var(--danger); }
  .btn-danger:hover { background: #fecaca; }
  .tool-row { display:flex; flex-wrap:wrap; gap:8px; margin: 14px 0; }

  /* ============ Stats ============ */
  .stats { background: var(--card); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding:18px 20px; margin-top:16px; }
  .stats .row { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .stat { text-align:center; min-width: 72px; }
  .stat .num { font-size: 26px; font-weight: 800; color: var(--ink); line-height:1.1; }
  .stat .lbl { font-size:12px; color: var(--muted); margin-top:2px; }
  .stat .num.ok { color: var(--ok); }
  .stat .num.fire { color: var(--warn); }
  .progress-wrap { flex:1; min-width: 200px; }
  .progress-top { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .progress-top b { color: var(--ink); }
  .bar { height: 12px; background: var(--bg); border-radius: 999px; overflow:hidden; }
  .bar > i { display:block; height:100%; background: linear-gradient(90deg, var(--ok), #22c55e); border-radius:999px; transition: width .4s ease; }
  .streak-badge { display:inline-flex; align-items:center; gap:6px; background: var(--warn-light); color:#b45309; font-weight:700; font-size:13px; padding:7px 12px; border-radius:999px; }

  /* ============ Add bar ============ */
  .addbar { background: var(--card); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding:14px 16px; margin-top:16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .addbar input[type=text] { flex:1; min-width: 200px; font:inherit; font-size:14px; padding:11px 13px; border:1px solid var(--line); border-radius: var(--radius-sm); color:var(--ink); }
  .addbar input[type=text]:focus { outline:none; border-color: var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
  .addbar select { font:inherit; font-size:13px; padding:10px 10px; border:1px solid var(--line); border-radius: var(--radius-sm); color:var(--ink-2); background:#fff; cursor:pointer; }
  .addbar .btn-primary { padding:11px 18px; }

  /* ============ Filter ============ */
  .filter { display:flex; gap:8px; margin:16px 0 0; flex-wrap:wrap; }
  .filter button { border:1px solid var(--line); background:#fff; font:inherit; font-size:13px; color:var(--muted); padding:6px 14px; border-radius:999px; cursor:pointer; }
  .filter button.active { background: var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }

  /* ============ List ============ */
  .list { margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .item { background: var(--card); border:1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
    padding:13px 15px; display:flex; align-items:flex-start; gap:12px; transition:.18s; }
  .item:hover { box-shadow: var(--shadow); }
  .item .chk { width:22px; height:22px; border-radius:7px; border:2px solid var(--muted-2); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-top:2px; transition:.15s; color:#fff; font-size:14px; font-weight:700; }
  .item.done .chk { background: var(--ok); border-color: var(--ok); }
  .item .main { flex:1; min-width:0; }
  .item .txt { font-size:15px; color: var(--ink); word-break:break-word; }
  .item.done .txt { text-decoration: line-through; color: var(--muted-2); }
  .item .meta { display:flex; gap:8px; margin-top:7px; flex-wrap:wrap; align-items:center; }
  .pill { font-size:11.5px; padding:3px 9px; border-radius:999px; font-weight:600; }
  .pill.cat { background: var(--brand-light); color: var(--brand-dark); }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:middle; }
  .pill.p-high { background: var(--danger-light); color: var(--p-high); }
  .pill.p-mid { background: var(--warn-light); color: var(--p-mid); }
  .pill.p-low { background:#f1f5f9; color: var(--p-low); }
  .item .edit-input { font:inherit; font-size:15px; width:100%; padding:6px 8px; border:1px solid var(--brand); border-radius:8px; color:var(--ink); }
  .item .ops { display:flex; gap:6px; flex-shrink:0; }
  .icon-btn { border:0; background:transparent; cursor:pointer; font-size:15px; color:var(--muted-2); padding:4px 6px; border-radius:8px; line-height:1; transition:.15s; }
  .icon-btn:hover { background: var(--bg); color: var(--ink); }
  .icon-btn.del:hover { background: var(--danger-light); color: var(--danger); }

  .empty { text-align:center; color:var(--muted); padding:40px 20px; background:var(--card); border:1px dashed var(--line); border-radius:var(--radius); margin-top:14px; }
  .empty .big { font-size:34px; margin-bottom:8px; }

  /* ============ History / Calendar ============ */
  .panel { background: var(--card); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding:18px 20px; margin-top:16px; }
  .panel h3 { font-size:15px; color:var(--ink); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-head .ym { font-size:15px; font-weight:700; color:var(--ink); }
  .cal-nav { display:flex; gap:6px; }
  .cal-nav button { border:1px solid var(--line); background:#fff; width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:15px; color:var(--ink-2); }
  .cal-nav button:hover { background: var(--brand-soft); color:var(--brand-dark); }
  .cal-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:6px; }
  .cal-grid .dow { text-align:center; font-size:12px; color:var(--muted); padding:4px 0; font-weight:600; }
  .cal-cell { aspect-ratio:1/1; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink-2); cursor:pointer; position:relative; border:1px solid transparent; transition:.15s; }
  .cal-cell:hover { background: var(--brand-soft); }
  .cal-cell.muted { color: var(--muted-2); cursor:default; }
  .cal-cell.muted:hover { background:transparent; }
  .cal-cell.today { border-color: var(--brand); font-weight:700; color: var(--brand-dark); }
  .cal-cell.has { background: var(--brand-light); font-weight:700; color: var(--brand-dark); }
  .cal-cell.has::after { content:""; position:absolute; bottom:6px; width:5px; height:5px; border-radius:50%; background: var(--brand); }
  .cal-cell.has.all-done { background: var(--ok-light); color:#15803d; }
  .cal-cell.has.all-done::after { background: var(--ok); }
  .cal-legend { display:flex; gap:16px; margin-top:12px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .cal-legend span { display:inline-flex; align-items:center; gap:6px; }
  .lg-dot { width:10px; height:10px; border-radius:50%; }

  .search-box { width:100%; font:inherit; font-size:14px; padding:11px 13px; border:1px solid var(--line); border-radius: var(--radius-sm); color:var(--ink); }
  .search-box:focus { outline:none; border-color: var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }

  .hist-day { margin-top:16px; }
  .hist-day .hd-date { font-size:14px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .hist-day .hd-date .rate { font-size:12px; font-weight:600; color:var(--ok); background: var(--ok-light); padding:2px 9px; border-radius:999px; }
  .hist-day .hd-date .rate.partial { color:var(--warn); background: var(--warn-light); }

  footer { text-align:center; color:var(--muted-2); font-size:13px; padding: 30px 20px 10px; }

  /* ============ Modal ============ */
  .mask { position:fixed; inset:0; background:rgba(15,23,42,0.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .mask.show { display:flex; }
  .modal { background:#fff; border-radius:var(--radius); max-width:380px; width:100%; padding:24px; box-shadow: var(--shadow-lg); animation: pop .2s ease; }
  @keyframes pop { from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);} }
  .modal h4 { font-size:17px; color:var(--ink); margin-bottom:10px; }
  .modal p { font-size:14px; color:var(--ink-2); margin-bottom:20px; }
  .modal .acts { display:flex; gap:10px; justify-content:flex-end; }

  .hidden { display:none !important; }
</style>
</head>
<body>
  <header class="header">
    <div class="header-main">
      <span class="eyebrow">✈ 航班工作工具集</span>
      <h1>📝 每日待办</h1>
      <p>按日期记录每天要做的事 · 一个一个勾掉 · 自动保存 · 可回看历史</p>
    </div>
    <div class="ic">✅</div>
  </header>

  <div class="container">
    <a class="back" href="../index.html">← 返回工具集首页</a>

    <!-- 工具条 -->
    <div class="toolbar">
      <div class="date-wrap">
        <label for="datePick">日期</label>
        <input type="date" id="datePick">
      </div>
      <div class="tabs">
        <button id="tabToday" class="active" onclick="switchView('today')">当日待办</button>
        <button id="tabHist" onclick="switchView('history')">历史记录</button>
      </div>
    </div>

    <!-- 顶部操作 -->
    <div class="tool-row">
      <button class="btn btn-ghost" onclick="copyYesterday()">📥 复制昨日待办</button>
      <button class="btn btn-ghost" onclick="exportAll()">⬇️ 导出备份</button>
      <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">⬆️ 导入备份</button>
      <button class="btn btn-danger" onclick="clearToday()">🗑 清空当天</button>
      <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importAll(this)">
    </div>

    <!-- ====== 当日视图 ====== -->
    <section id="view-today">
      <div class="stats">
        <div class="row">
          <div class="stat"><div class="num" id="stDone">0</div><div class="lbl">已完成</div></div>
          <div class="stat"><div class="num" id="stTotal">0</div><div class="lbl">总事项</div></div>
          <div class="progress-wrap">
            <div class="progress-top"><span>当日完成率</span><b id="stRate">0%</b></div>
            <div class="bar"><i id="stBar" style="width:0%"></i></div>
          </div>
          <div class="streak-badge" id="streakBadge">🔥 连续 0 天</div>
        </div>
      </div>

      <div class="addbar">
        <input type="text" id="addInput" placeholder="写点今天要做的事，回车添加…" onkeydown="if(event.key==='Enter')addItem()">
        <select id="addPri">
          <option value="high">高优先级</option>
          <option value="mid" selected>中优先级</option>
          <option value="low">低优先级</option>
        </select>
        <select id="addCat">
          <option value="work" selected>工作</option>
          <option value="life">生活</option>
          <option value="study">学习</option>
        </select>
        <button class="btn btn-primary" onclick="addItem()">＋ 添加</button>
      </div>

      <div class="filter">
        <button class="active" data-f="all" onclick="setFilter('all',this)">全部</button>
        <button data-f="undone" onclick="setFilter('undone',this)">未完成</button>
        <button data-f="done" onclick="setFilter('done',this)">已完成</button>
      </div>

      <div class="list" id="list"></div>
    </section>

    <!-- ====== 历史视图 ====== -->
    <section id="view-history" class="hidden">
      <div class="panel">
        <div class="cal-head">
          <div class="ym" id="calYM"></div>
          <div class="cal-nav">
            <button onclick="calMove(-1)">‹</button>
            <button onclick="calMove(1)">›</button>
          </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend">
          <span><i class="lg-dot" style="background:var(--brand-light);border:1px solid var(--brand)"></i> 有记录（含未完）</span>
          <span><i class="lg-dot" style="background:var(--ok-light);border:1px solid var(--ok)"></i> 当天全部完成</span>
          <span><i class="lg-dot" style="background:var(--brand)"></i> 点击日期查看当天</span>
        </div>
      </div>

      <div class="panel">
        <h3>🔍 搜索历史待办</h3>
        <input type="text" class="search-box" id="searchBox" placeholder="输入关键词，跨所有日期搜索（如「周报」「升舱」）" oninput="renderHistory()">
      </div>

      <div id="historyList"></div>
    </section>

    <footer>每日待办 · 数据只保存在你这台浏览器的本地，不会上传任何服务器</footer>
  </div>

  <!-- 确认弹窗 -->
  <div class="mask" id="mask">
    <div class="modal">
      <h4 id="mTitle">确认操作</h4>
      <p id="mText">确定要执行吗？</p>
      <div class="acts">
        <button class="btn btn-ghost" id="mCancel">取消</button>
        <button class="btn btn-primary" id="mOk">确定</button>
      </div>
    </div>
  </div>

<script>
  /* ===================== 数据层 ===================== */
  const KEY = 'flight-todo-v1';
  let DB = load();
  let currentView = 'today';
  let filterMode = 'all';
  let calYear, calMonth; // 当前日历显示的年月（month: 0-11）
  let pendingOk = null;  // 确认弹窗回调

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(DB)); }
  function todayStr() {
    const d = new Date();
    return fmt(d);
  }
  function fmt(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function getDay(ds) { return DB[ds] || []; }
  function setDay(ds, list) { DB[ds] = list; save(); }

  const PRI_LABEL = { high: '高', mid: '中', low: '低' };
  const CAT_LABEL = { work: '工作', life: '生活', study: '学习' };
  const PRI_ORDER = { high: 0, mid: 1, low: 2 };

  /* ===================== 初始化 ===================== */
  const datePick = document.getElementById('datePick');
  datePick.value = todayStr();
  datePick.max = todayStr(); // 不能选未来（避免"计划未来"混乱，可按需放开）
  datePick.addEventListener('change', () => { render(); });

  // 日历初始为所选日期所在月
  const initD = new Date();
  calYear = initD.getFullYear();
  calMonth = initD.getMonth();

  render();

  /* ===================== 视图切换 ===================== */
  function switchView(v) {
    currentView = v;
    document.getElementById('tabToday').classList.toggle('active', v === 'today');
    document.getElementById('tabHist').classList.toggle('active', v === 'history');
    document.getElementById('view-today').classList.toggle('hidden', v !== 'today');
    document.getElementById('view-history').classList.toggle('hidden', v !== 'history');
    render();
  }

  function setFilter(f, btn) {
    filterMode = f;
    document.querySelectorAll('.filter button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  }

  /* ===================== 增删改 ===================== */
  function addItem() {
    const inp = document.getElementById('addInput');
    const text = inp.value.trim();
    if (!text) { inp.focus(); return; }
    const ds = datePick.value || todayStr();
    const list = getDay(ds);
    list.push({
      id: Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      text,
      done: false,
      priority: document.getElementById('addPri').value,
      cat: document.getElementById('addCat').value,
      createdAt: Date.now(),
      doneAt: null
    });
    setDay(ds, list);
    inp.value = '';
    inp.focus();
    render();
  }

  function toggleItem(id) {
    const ds = datePick.value || todayStr();
    const list = getDay(ds);
    const it = list.find(x => x.id === id);
    if (!it) return;
    it.done = !it.done;
    it.doneAt = it.done ? Date.now() : null;
    setDay(ds, list);
    render();
  }

  function deleteItem(id) {
    confirmAction('删除这条待办？', '删除后无法恢复（当天的其它待办不受影响）。', () => {
      const ds = datePick.value || todayStr();
      let list = getDay(ds);
      list = list.filter(x => x.id !== id);
      setDay(ds, list);
      render();
    });
  }

  function startEdit(id) {
    const el = document.querySelector(`[data-edit="${id}"]`);
    if (!el) return;
    const ds = datePick.value || todayStr();
    const it = getDay(ds).find(x => x.id === id);
    if (!it) return;
    el.outerHTML = `<input class="edit-input" data-editing="${id}" value="${escAttr(it.text)}" onkeydown="if(event.key==='Enter')commitEdit('${id}')" onblur="commitEdit('${id}')">`;
    const inp = document.querySelector(`[data-editing="${id}"]`);
    inp.focus(); inp.select();
  }
  function commitEdit(id) {
    const inp = document.querySelector(`[data-editing="${id}"]`);
    if (!inp) return;
    const text = inp.value.trim();
    const ds = datePick.value || todayStr();
    const list = getDay(ds);
    const it = list.find(x => x.id === id);
    if (it && text) { it.text = text; setDay(ds, list); }
    render();
  }

  function clearToday() {
    const ds = datePick.value || todayStr();
    const list = getDay(ds);
    if (list.length === 0) { toast('当天没有待办，无需清空'); return; }
    confirmAction('清空当天的待办？', `将删除 ${ds} 的全部 ${list.length} 条待办，此操作不可恢复。`, () => {
      delete DB[ds]; save(); render();
    });
  }

  function copyYesterday() {
    const ds = datePick.value || todayStr();
    const y = new Date(ds); y.setDate(y.getDate() - 1);
    const ys = fmt(y);
    const src = getDay(ys);
    if (src.length === 0) { toast(`${ys} 没有待办可复制`); return; }
    const dst = getDay(ds).slice();
    let added = 0;
    src.forEach(s => {
      dst.push({
        id: Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        text: s.text, done: false, priority: s.priority, cat: s.cat,
        createdAt: Date.now(), doneAt: null
      });
      added++;
    });
    setDay(ds, dst);
    toast(`已从 ${ys} 复制 ${added} 条待办到 ${ds}`);
    render();
  }

  /* ===================== 渲染 ===================== */
  function render() {
    if (currentView === 'today') renderToday();
    else renderHistory();
  }

  function renderToday() {
    const ds = datePick.value || todayStr();
    const list = getDay(ds);
    const done = list.filter(x => x.done).length;
    const total = list.length;
    const rate = total ? Math.round(done / total * 100) : 0;
    document.getElementById('stDone').textContent = done;
    document.getElementById('stTotal').textContent = total;
    document.getElementById('stRate').textContent = rate + '%';
    document.getElementById('stBar').style.width = rate + '%';

    // 连续打卡
    const si = streakInfo();
    const badge = document.getElementById('streakBadge');
    if (si.todayComplete) badge.textContent = `🔥 连续 ${si.streak + 1} 天全完成`;
    else if (si.streak > 0) badge.textContent = `⏳ 今天进行中 · 已连续 ${si.streak} 天`;
    else badge.textContent = `🌱 今天开始记录吧`;

    renderList();
  }

  function renderList() {
    const ds = datePick.value || todayStr();
    let list = getDay(ds).slice();
    if (filterMode === 'undone') list = list.filter(x => !x.done);
    else if (filterMode === 'done') list = list.filter(x => x.done);
    // 排序：未完成在前；同状态按优先级 high→low
    list.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return PRI_ORDER[a.priority] - PRI_ORDER[b.priority];
    });

    const box = document.getElementById('list');
    if (list.length === 0) {
      const msg = getDay(ds).length === 0
        ? '这一天还没有待办，先在上面加一条吧 👆'
        : '没有符合筛选条件的待办';
      box.innerHTML = `<div class="empty"><div class="big">🗒️</div>${msg}</div>`;
      return;
    }
    box.innerHTML = list.map(it => itemHTML(it)).join('');
  }

  function itemHTML(it) {
    const pCls = 'p-' + it.priority;
    const dotColor = it.priority === 'high' ? 'var(--p-high)' : it.priority === 'mid' ? 'var(--p-mid)' : 'var(--p-low)';
    return `<div class="item ${it.done ? 'done' : ''}">
      <div class="chk" onclick="toggleItem('${it.id}')">${it.done ? '✓' : ''}</div>
      <div class="main">
        <div class="txt" data-edit="${it.id}" ondblclick="startEdit('${it.id}')">${escHtml(it.text)}</div>
        <div class="meta">
          <span class="pill ${pCls}"><i class="dot" style="background:${dotColor}"></i>${PRI_LABEL[it.priority]}优先</span>
          <span class="pill cat">${CAT_LABEL[it.cat] || it.cat}</span>
        </div>
      </div>
      <div class="ops">
        <button class="icon-btn" title="编辑" onclick="startEdit('${it.id}')">✏️</button>
        <button class="icon-btn del" title="删除" onclick="deleteItem('${it.id}')">🗑</button>
      </div>
    </div>`;
  }

  function streakInfo() {
    const today = todayStr();
    const tList = getDay(today);
    const todayComplete = tList.length > 0 && tList.every(x => x.done);
    let streak = 0;
    const d = new Date(today);
    d.setDate(d.getDate() - 1);
    while (true) {
      const ds = fmt(d);
      const list = getDay(ds);
      if (list.length === 0) break;
      if (list.every(x => x.done)) { streak++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return { streak, todayComplete };
  }

  /* ===================== 历史 / 日历 ===================== */
  function renderHistory() {
    renderCalendar();
    renderHistoryList();
  }

  function renderCalendar() {
    const grid = document.getElementById('calGrid');
    const ym = document.getElementById('calYM');
    ym.textContent = `${calYear} 年 ${calMonth + 1} 月`;
    const first = new Date(calYear, calMonth, 1).getDay(); // 0=周日
    const days = new Date(calYear, calMonth + 1, 0).getDate();
    const dows = ['日', '一', '二', '三', '四', '五', '六'];
    let html = dows.map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < first; i++) html += `<div class="cal-cell muted"></div>`;
    const tStr = todayStr();
    for (let d = 1; d <= days; d++) {
      const ds = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const list = getDay(ds);
      let cls = 'cal-cell';
      if (ds === tStr) cls += ' today';
      if (list.length > 0) {
        cls += ' has';
        if (list.every(x => x.done)) cls += ' all-done';
      }
      const title = list.length ? `title="${ds}：${list.length} 条，已完成 ${list.filter(x=>x.done).length}"` : '';
      html += `<div class="${cls}" ${title} onclick="gotoDate('${ds}')">${d}</div>`;
    }
    grid.innerHTML = html;
  }

  function calMove(delta) {
    calMonth += delta;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  }

  function gotoDate(ds) {
    datePick.value = ds;
    switchView('today');
  }

  function renderHistoryList() {
    const box = document.getElementById('historyList');
    const kw = (document.getElementById('searchBox').value || '').trim().toLowerCase();
    const dates = Object.keys(DB).filter(ds => DB[ds] && DB[ds].length > 0).sort().reverse();

    if (dates.length === 0) {
      box.innerHTML = `<div class="empty"><div class="big">📭</div>还没有任何历史记录</div>`;
      return;
    }

    let html = '';
    for (const ds of dates) {
      let items = DB[ds];
      if (kw) items = items.filter(it => it.text.toLowerCase().includes(kw));
      if (items.length === 0) continue;
      const done = items.filter(x => x.done).length;
      const total = items.length;
      const allDone = done === total;
      html += `<div class="hist-day">
        <div class="hd-date">📅 ${ds}
          <span class="rate ${allDone ? '' : 'partial'}">${done}/${total} 完成</span>
        </div>`;
      html += items.map(it => {
        const dotColor = it.priority === 'high' ? 'var(--p-high)' : it.priority === 'mid' ? 'var(--p-mid)' : 'var(--p-low)';
        return `<div class="item ${it.done ? 'done' : ''}" style="cursor:default">
          <div class="chk" style="cursor:default">${it.done ? '✓' : ''}</div>
          <div class="main">
            <div class="txt">${escHtml(it.text)}</div>
            <div class="meta">
              <span class="pill p-${it.priority}"><i class="dot" style="background:${dotColor}"></i>${PRI_LABEL[it.priority]}优先</span>
              <span class="pill cat">${CAT_LABEL[it.cat] || it.cat}</span>
            </div>
          </div>
        </div>`;
      }).join('');
      html += `</div>`;
    }

    if (!html) box.innerHTML = `<div class="empty"><div class="big">🔍</div>没找到包含「${escHtml(kw)}」的待办</div>`;
    else box.innerHTML = html;
  }

  /* ===================== 导入 / 导出 ===================== */
  function exportAll() {
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `每日待办备份_${todayStr().replace(/-/g, '')}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已导出全部待办备份');
  }

  function importAll(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (typeof data !== 'object' || Array.isArray(data)) throw new Error('格式不对');
        confirmAction('导入备份？', `将用备份文件覆盖当前所有待办数据（共 ${Object.keys(data).length} 天）。建议先导出当前数据再操作。`, () => {
          DB = data; save(); render(); toast('导入成功');
        });
      } catch (e) {
        toast('导入失败：文件格式不正确');
      }
      input.value = '';
    };
    reader.readAsText(file);
  }

  /* ===================== 工具 ===================== */
  function escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function escAttr(s) { return escHtml(s).replace(/"/g, '&quot;'); }

  let toastTimer;
  function toast(msg) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-lg);z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 1600);
  }

  function confirmAction(title, text, onOk) {
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mText').textContent = text;
    document.getElementById('mask').classList.add('show');
    pendingOk = onOk;
  }
  document.getElementById('mCancel').onclick = () => {
    document.getElementById('mask').classList.remove('show');
    pendingOk = null;
  };
  document.getElementById('mOk').onclick = () => {
    const fn = pendingOk;
    document.getElementById('mask').classList.remove('show');
    pendingOk = null;
    if (fn) fn();
  };
  document.getElementById('mask').addEventListener('click', (e) => {
    if (e.target.id === 'mask') { document.getElementById('mask').classList.remove('show'); pendingOk = null; }
  });
</script>
</body>
</html>
